# =============================================================================
# 2.4 — Spring Cloud AWS 3.x Auto-configuration
# =============================================================================
#
# Spring Cloud AWS reads these properties at startup and automatically creates
# AWS client beans (DynamoDbClient, SqsAsyncClient, SnsClient) for you.
#
# Without Spring Cloud AWS → you manually create @Bean in AwsConfig.java (2.3)
# With Spring Cloud AWS    → just set these properties, inject the clients directly
# =============================================================================

# ── Region ────────────────────────────────────────────────────────────────────
# Tell Spring Cloud AWS which AWS region to use for all clients
spring.cloud.aws.region.static=ap-southeast-2

# ── Credentials ───────────────────────────────────────────────────────────────
# In LOCAL development: leave these commented out
#   SDK automatically reads from ~/.aws/credentials (set by 'aws configure')
#
# In PRODUCTION (EC2 / ECS / Lambda): leave commented out
#   AWS attaches an IAM role to your compute — SDK picks it up automatically
#   This is the CORRECT way — no keys in config files
#
# Only set these if you have no other option (not recommended):
# spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID}
# spring.cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY}

# ── Endpoint Override (LocalStack) ────────────────────────────────────────────
# When running LocalStack locally, point all AWS clients to localhost
# Comment this out when connecting to real AWS
# spring.cloud.aws.endpoint=http://localhost:4566

# ── Application-specific properties ──────────────────────────────────────────
# These are NOT Spring Cloud AWS — they are your own app properties
# injected via @Value in your service classes

# SNS topic ARN where order events are published
aws.sns.order-topic-arn=arn:aws:sns:ap-southeast-2:984454382434:order-events

# SQS queue name that the @SqsListener connects to
aws.sqs.order-queue=delivery-orders

# Real queue URLs from sns-fanout-stack
aws.sqs.notification-queue-url=https://sqs.ap-southeast-2.amazonaws.com/984454382434/notification-queue
aws.sqs.analytics-queue-url=https://sqs.ap-southeast-2.amazonaws.com/984454382434/analytics-queue

# DynamoDB table name from dynamodb-table-stack
aws.dynamodb.table-name=delivery-platform

# =============================================================================
# 2.20 - X-Ray Tracing
# =============================================================================
# X-Ray daemon listens on UDP 2000 - default address used by SDK
# In ECS: run X-Ray daemon as a sidecar container on the same task
# In Lambda: daemon is built-in, enable Active Tracing in function config
# No property needed - XRayConfig.java initialises the recorder at startup

# =============================================================================
# 2.21 - Secrets Manager & Parameter Store
# =============================================================================
# Secret name stored in Secrets Manager (JSON: {"username":"...","password":"..."})
aws.secrets.db-credentials=lastmile/prod/db-credentials

# SSM Parameter Store path prefix - getAllByPath() fetches everything under this
aws.ssm.path=/lastmile/prod/

# Disable X-Ray SDK exceptions when no daemon is running locally
# In production (ECS/Lambda) remove this — daemon will be present
com.amazonaws.xray.strategy.LogErrorContextMissingStrategy=true
